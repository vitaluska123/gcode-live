[package]
name = "pcb-frame-generator"
version = "0.1.103"
edition = "2021"


[dependencies]
slint = { version = "1.17.1", features = ["renderer-femtovg"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rfd = "0.14"
thiserror = "1.0"
glow = "0.17"
glutin = "0.32"
glutin-winit = "0.5"
winit = "0.30"

[[bin]]
name = "pcb-frame-generator"
path = "src/main.rs"

[build-dependencies]
slint-build = "1.17.1"

# `cargo run` is the normal way this desktop application is launched during
# development. A small optimisation level keeps Slint's text editor responsive
# while retaining debug information and fast enough rebuilds.
[profile.dev]
opt-level = 2
