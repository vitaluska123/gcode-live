[package]
name = "pcb-frame-generator"
version = "1.6.140"
edition = "2021"


[dependencies]
slint = { version = "1.17.1", default-features = false, features = ["std", "backend-winit", "renderer-femtovg", "renderer-software", "compat-1-2", "unstable-winit-030"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rfd = "0.17.2"
thiserror = "2.0.20"
image = { version = "0.25", default-features = false, features = ["png"] }
# Used with the OpenGL context owned by Slint/FemtoVG. This crate is already a
# transitive dependency of the selected Slint renderer and adds no windowing
# or context implementation of its own.
glow = "0.18"
euclid = "0.22"

[[bin]]
name = "pcb-frame-generator"
path = "src/main.rs"

[build-dependencies]
slint-build = "1.17.1"

# `cargo run` is the normal way this desktop application is launched during
# development. A small optimisation level keeps Slint's text editor responsive
# while retaining debug information and fast enough rebuilds.
[profile.dev]
opt-level = 2
